name: Bounty Hunter Bot
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Bot
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python bounty_bot.py
      - name: Guardar estado de issues vistos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Bounties seguros vistos actualizados"
          file_pattern: 'seen_issues.json'
