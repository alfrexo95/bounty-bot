name: Bounty Hunter Bot
on:
  schedule:
    - cron: '0 10,18 * * *'
  workflow_dispatch:
    inputs:
      issue_url:
        description: 'URL del issue especifico a resolver (opcional)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests dbgagent
      - name: Run Bot
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_URL: ${{ github.event.inputs.issue_url }}
        run: python bounty_bot.py
