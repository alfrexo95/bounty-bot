name: Web3 Bounty Hunter

on:
  schedule:
    - cron: '0 */3 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write
  issues: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Web3 Bot
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python search_web3_bounties.py
      - name: Guardar estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Web3 bounties vistos"
          file_pattern: 'seen_web3.json'
